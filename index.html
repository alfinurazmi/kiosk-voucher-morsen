<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Kiosk Scan Barcode Voucher</title>
<style>
  :root {
    --bg: #0e1013; --panel: #171a1f; --border: #2a2f37; --accent: #35d07f;
    --accent-dim: #1f7a4d; --warn: #e0a63e; --error: #e35b5b; --text: #eef1f5; --text-dim: #8b93a1;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; overflow: hidden; }
  #app { display: grid; grid-template-columns: 1fr 340px; height: 100vh; }
  #stage { position: relative; display: flex; align-items: center; justify-content: center; background: #000; overflow: hidden; }
  
  /* Area video preview */
  #reader { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; position: relative;}
  #reader video { max-width: 100%; max-height: 100%; object-fit: cover; }
  
  /* Overlay kotak panduan scan */
  .scan-region-highlight { position: absolute; border: 3px solid var(--accent); border-radius: 12px; box-shadow: 0 0 10px var(--accent-dim); animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(53, 208, 127, 0); } 100% { box-shadow: 0 0 0 0 rgba(53, 208, 127, 0); } }

  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; transition: opacity 120ms ease-out; }
  #flash.on { opacity: 0.85; transition: none; }

  #sidebar { background: var(--panel); border-left: 1px solid var(--border); display: flex; flex-direction: column; padding: 20px; gap: 16px; overflow-y: auto; }
  h1 { font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-dim); margin: 0 0 4px 0; font-weight: 600; }
  
  .status-card { background: #10131700; border: 1px solid var(--border); border-radius: 10px; padding: 14px; }
  .status-row { display: flex; align-items: center; gap: 10px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; transition: background 150ms; background: var(--text-dim); }
  .dot.searching { background: var(--text-dim); animation: blink 1s infinite; }
  .dot.captured { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
  .dot.error { background: var(--error); box-shadow: 0 0 8px var(--error); }
  @keyframes blink { 50% { opacity: 0.2; } }
  
  #statusText { font-size: 14px; font-weight: 500; }
  #statusSub { font-size: 12px; color: var(--text-dim); margin-top: 4px; }

  select, button { font-family: inherit; font-size: 13px; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border); background: #1d2129; color: var(--text); cursor: pointer; }
  button.primary { background: var(--accent-dim); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.primary:hover { background: var(--accent); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }
  label.field { font-size: 12px; color: var(--text-dim); display: flex; flex-direction: column; gap: 6px; }

  #log { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; min-height: 120px; }
  .log-item { background: #1d2129; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 13px; animation: slideIn 200ms ease-out; }
  .log-item.err { border-color: var(--error); }
  .log-item .name { font-weight: 600; }
  .log-item .phone { color: var(--text-dim); }
  .log-item .time { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
  @keyframes slideIn { from { opacity: 0; transform: translateY(-6px);} to { opacity: 1; transform: translateY(0);} }

  #count { font-size: 28px; font-weight: 700; }
  #countLabel { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.05em; }

  @media (max-width: 860px) {
    #app { grid-template-columns: 1fr; grid-template-rows: 1fr auto; }
    #sidebar { border-left: none; border-top: 1px solid var(--border); max-height: 35vh; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="reader"></div>
    <div id="flash"></div>
  </div>

  <div id="sidebar">
    <h1>Kiosk Scan Barcode</h1>

    <div class="status-card">
      <div class="status-row">
        <div id="statusDot" class="dot searching"></div>
        <div>
          <div id="statusText">Arahkan barcode ke kamera...</div>
          <div id="statusSub">Pindai QR/Barcode pada voucher untuk memulai</div>
        </div>
      </div>
    </div>

    <label class="field">
      Kamera
      <select id="cameraSelect"></select>
    </label>

    <div style="display:flex; gap:8px;">
      <button id="startBtn" class="primary" style="flex:1;">Mulai Kamera</button>
    </div>

    <div class="status-card" style="display:flex; justify-content:space-between; align-items:center;">
      <div>
        <div id="count">0</div>
        <div id="countLabel">Voucher Tersimpan</div>
      </div>
      <div style="text-align:right; font-size:11px; color:var(--text-dim);">
        Mode:<br>
        <span style="color:var(--accent)">Barcode Auto-Capture</span>
      </div>
    </div>

    <div style="font-size:12px; color:var(--text-dim); margin-top:4px;">Riwayat Terbaru</div>
    <div id="log"></div>
  </div>
</div>

<script src="https://unpkg.com/html5-qrcode"></script>

<script>
(() => {
  // GANTI DENGAN URL WEB APP GOOGLE APPS SCRIPT ANDA (berakhiran /exec)
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbxBoAKoG4riE271KF2k32HqR9vBoEIdC4DFV-TZw_Ez-6plTjqwQE7n0VEP_N3yLb8q/exec';

  const statusDot = document.getElementById('statusDot');
  const statusText = document.getElementById('statusText');
  const statusSub = document.getElementById('statusSub');
  const cameraSelect = document.getElementById('cameraSelect');
  const startBtn = document.getElementById('startBtn');
  const countEl = document.getElementById('count');
  const logEl = document.getElementById('log');
  const flashEl = document.getElementById('flash');

  let html5QrCode = null;
  let isProcessing = false;
  let savedCount = 0;
  let audioCtx = null;

  // Inisialisasi AudioContext untuk efek beep
  function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }

  // Fungsi efek suara beep pendek
  function beep() {
    try {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.value = 880;
      gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.18);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(); osc.stop(audioCtx.currentTime + 0.2);
    } catch (e) {}
  }

  // Efek kilat layar kamera saat sukses
  function flash() {
    flashEl.classList.add('on');
    requestAnimationFrame(() => {
      flashEl.style.transition = 'opacity 250ms ease-out';
      flashEl.classList.remove('on');
      setTimeout(() => { flashEl.style.transition = ''; }, 260);
    });
  }

  // Fungsi untuk memulai kamera dan scanner
  async function startScanner() {
    startBtn.disabled = true;
    startBtn.innerText = 'Memulai Kamera...';

    try {
      // Hentikan scanner jika sedang berjalan
      if (html5QrCode && html5QrCode.isScanning) {
        await html5QrCode.stop();
      }

      // Konfigurasi kamera (menggunakan kamera belakang)
      const config = { fps: 10, qrbox: { width: 250, height: 250 } };
      const cameraId = cameraSelect.value;
      
      // Jika tidak ada kamera spesifik yang dipilih, gunakan kamera belakang default
      const targetCamera = cameraId ? { exact: cameraId } : { facingMode: "environment" };

      // Memulai pemindaian
      if (!html5QrCode) html5QrCode = new Html5Qrcode("reader");
      await html5QrCode.start(
        targetCamera, 
        config, 
        onScanSuccess, // Callback saat barcode ditemukan
        onScanFailure  // Callback saat gagal membaca frame (abaikan)
      );

      captureBtnEnabledState(true);
      setStatus('searching', 'Arahkan barcode ke kamera...', 'Tempatkan voucher di bawah tripod');
      startBtn.innerText = 'Kamera Aktif';

    } catch (err) {
      setStatus('error', 'Gagal mengakses kamera', err.message);
      startBtn.disabled = false;
      startBtn.innerText = 'Mulai Ulang Kamera';
    }
  }

  // Fungsi ini dipanggil SETIAP KALI barcode/QR code terbaca
  function onScanSuccess(decodedText, decodedResult) {
    // Mencegah pemrosesan ganda dalam jeda waktu pemrosesan server
    if (isProcessing) return;
    isProcessing = true;

    beep(); // Suara pemicu
    flash(); // Visual pemicu
    
    setStatus('captured', 'Barcode terbaca!', 'Memproses data...');
    
    // Hentikan pemindaian sementara agar server tidak terbebani saat pemrosesan
    html5QrCode.pause();

    // Ambil gambar terkini dari video stream untuk dikirim ke AI
    // Kita akses elemen video langsung dari DOM yang dibuat oleh html5-qrcode
    const videoEl = document.querySelector('#reader video');
    if (!videoEl) {
        console.error('Video element not found');
        resumeScannerAfterCooldown();
        return;
    }
    
    const canvas = document.createElement('canvas');
    canvas.width = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    
    // Ubah ke format JPEG base64
    const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
    
    // Kirim ke backend Google Apps Script
    sendToServer(dataUrl, decodedText);
  }

  // Fungsi untuk mengirim gambar ke AI dan mencatat ke Sheets
  async function sendToServer(dataUrl, barcodeContent) {
    try {
      const res = await fetch(WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ dataUrl: dataUrl, barcode: barcodeContent })
      });
      const json = await res.json();
      
      if (json.status === 'success') {
        savedCount++;
        countEl.textContent = savedCount;
        setStatus('captured', 'Tersimpan!', `${json.nama} — ${json.no_hp}`);
        addLog({ status: 'ok', nama: json.nama, no_hp: json.no_hp });
      } else {
        setStatus('error', 'Gagal membaca voucher', json.message || 'Coba ulangi scan');
        addLog({ status: 'err', text: `Gagal: ${json.message || 'Error AI'} (Barcode: ${barcodeContent})` });
      }
    } catch (err) {
      setStatus('error', 'Koneksi ke server gagal', err.message);
      addLog({ status: 'err', text: 'Koneksi gagal: ' + err.message });
    } finally {
      // Lanjutkan pemindaian setelah jeda singkat
      resumeScannerAfterCooldown();
    }
  }

  // Menangani kegagalan baca frame (cukup log di console atau abaikan)
  function onScanFailure(error) {
    // Tidak perlu melakukan apa-apa, ini terjadi terus menerus saat mencari pola
  }

  // Menangani kamera sibuk atau gagal dimuat setelah jeda
  function resumeScannerAfterCooldown() {
    setTimeout(() => {
      isProcessing = false;
      if (html5QrCode && html5QrCode.isPaused) {
        html5QrCode.
